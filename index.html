  const vsJun25=((d.jun26.retail-d.jun25.retail)/d.jun25.retail*100);

    {label:"Червень 2026 (роздріб)",val:d.jun26.retail,bold:true},

      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
        {items.map(i=>(
          <div key={i.label} style={{background:"#fff",border:"1px solid #e0f2fe",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
            <div style={{fontSize:10,color:"#64748b",marginBottom:4}}>{i.label}</div>
            <div style={{fontSize:i.bold?20:16,fontWeight:800,color:i.bold?"#0369a1":"#1e293b"}}>{fmt(i.val)} ₴</div>
          </div>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginTop:10}}>
        <div style={{background:"#fff",border:"1px solid #e0f2fe",borderRadius:8,padding:"8px",textAlign:"center"}}>
          <div style={{fontSize:10,color:"#64748b"}}>vs Червень 2025</div>
          <div style={{fontSize:16,fontWeight:800,color:vsJun25>0?"#059669":"#ef4444"}}>{vsJun25>0?"+":""}{vsJun25.toFixed(1)}%</div>
        </div>
        <div style={{background:"#fff",border:"1px solid #e0f2fe",borderRadius:8,padding:"8px",textAlign:"center"}}>
          <div style={{fontSize:10,color:"#64748b"}}>vs Травень 2026</div>
          <div style={{fontSize:16,fontWeight:800,color:vsMay26>0?"#059669":"#ef4444"}}>{vsMay26>0?"+":""}{vsMay26.toFixed(1)}%</div>
        </div>
        <div style={{background:"#fff",border:"1px solid #e0f2fe",borderRadius:8,padding:"8px",textAlign:"center"}}>
          <div style={{fontSize:10,color:"#64748b"}}>vs Чер 2025 (без мікро)</div>
          <div style={{fontSize:16,fontWeight:800,color:vsJun25noM>0?"#059669":"#ef4444"}}>{vsJun25noM>0?"+":""}{vsJun25noM.toFixed(1)}%</div>
        </div>
        <div style={{background:"#fff",border:"1px solid #e0f2fe",borderRadius:8,padding:"8px",textAlign:"center"}}>
          <div style={{fontSize:10,color:"#64748b"}}>vs Трав 2026 (без мікро)</div>
          <div style={{fontSize:16,fontWeight:800,color:vsMay26noM>0?"#059669":"#ef4444"}}>{vsMay26noM>0?"+":""}{vsMay26noM.toFixed(1)}%</div>
        </div>
      </div>
    </div>
  );
}


function SalesTrend({project,data}){
  const [period,setPeriod]=useState("months");
  const color=projectColors[project]||"#0f172a";
  const points=period==="months"
    ? Object.entries(data).map(([key,d])=>({label:d.label,revenue:d.revenue,orders:d.orders,key}))
    : WEEKLY_DATA[project];
  const chartWidth=Math.max(720,points.length*84);
  const chartHeight=278;
  const pad={left:72,right:30,top:34,bottom:64};
  const maxValue=Math.max(...points.map(p=>p.revenue),1);
  const graphHeight=chartHeight-pad.top-pad.bottom;
  const graphWidth=chartWidth-pad.left-pad.right;
  const x=i=>pad.left+(points.length===1?graphWidth/2:(i*graphWidth/(points.length-1)));
  const y=v=>pad.top+graphHeight-(v/maxValue)*graphHeight;
  const linePath=points.map((p,i)=>`${i===0?"M":"L"} ${x(i)} ${y(p.revenue)}`).join(" ");
  const areaPath=`${linePath} L ${x(points.length-1)} ${pad.top+graphHeight} L ${x(0)} ${pad.top+graphHeight} Z`;
  const last=points[points.length-1]||{revenue:0,orders:0};
  const prev=points[points.length-2]||null;
  const delta=prev&&prev.revenue>0?((last.revenue-prev.revenue)/prev.revenue)*100:null;
  const best=points.reduce((a,b)=>b.revenue>a.revenue?b:a,points[0]);
  const gradId=`salesGradient-${project}-${period}`;
  return(
    <div className="trend-card" style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:16,padding:"18px 18px 14px",marginBottom:18,boxShadow:"0 8px 24px rgba(15,23,42,0.04)"}}>
      <div className="trend-header" style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:14,flexWrap:"wrap",marginBottom:14}}>
        <div>
          <div style={{fontSize:15,fontWeight:900,letterSpacing:"-0.02em",color:"#0f172a"}}>Динаміка продажів</div>
          <div style={{fontSize:11,color:"#94a3b8",marginTop:4}}>Фактична виручка · оплачені роздрібні замовлення{period==="weeks"?" · липень 2026":""}</div>
        </div>
        <div className="trend-toggle" style={{display:"flex",gap:4,background:"#f1f5f9",padding:4,borderRadius:10}}>
          {[{id:"months",label:"По місяцях"},{id:"weeks",label:"По тижнях"}].map(item=>(
            <button key={item.id} onClick={()=>setPeriod(item.id)} style={{border:"none",borderRadius:7,padding:"7px 12px",fontSize:11,fontWeight:800,cursor:"pointer",fontFamily:"'Inter',sans-serif",background:period===item.id?"#fff":"transparent",color:period===item.id?"#0f172a":"#94a3b8",boxShadow:period===item.id?"0 2px 8px rgba(15,23,42,.08)":"none"}}>{item.label}</button>
          ))}
        </div>
      </div>

      <div className="trend-summary" style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:8,marginBottom:8}}>
        <div style={{background:"#f8fafc",borderRadius:10,padding:"9px 11px"}}>
          <div style={{fontSize:9,color:"#94a3b8",fontWeight:700,textTransform:"uppercase",letterSpacing:".04em"}}>Останній період</div>
          <div style={{fontSize:16,fontWeight:900,color:"#0f172a",marginTop:3}}>{fmt(last.revenue)} ₴</div>
        </div>
        <div style={{background:"#f8fafc",borderRadius:10,padding:"9px 11px"}}>
          <div style={{fontSize:9,color:"#94a3b8",fontWeight:700,textTransform:"uppercase",letterSpacing:".04em"}}>До попереднього</div>
          <div style={{fontSize:16,fontWeight:900,color:delta===null?"#94a3b8":delta>=0?"#059669":"#ef4444",marginTop:3}}>{delta===null?"—":`${delta>=0?"+":""}${delta.toFixed(1)}%`}</div>
        </div>
        <div style={{background:"#f8fafc",borderRadius:10,padding:"9px 11px"}}>
          <div style={{fontSize:9,color:"#94a3b8",fontWeight:700,textTransform:"uppercase",letterSpacing:".04em"}}>Найкращий період</div>
          <div style={{fontSize:12,fontWeight:900,color:"#0f172a",marginTop:5,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{best.label} · {fmtCompact(best.revenue)} ₴</div>
        </div>
      </div>

      <div style={{overflowX:"auto",overflowY:"hidden",WebkitOverflowScrolling:"touch"}}>
        <svg width="100%" height={chartHeight} viewBox={`0 0 ${chartWidth} ${chartHeight}`} style={{display:"block",minWidth:chartWidth}}>
          <defs>
            <linearGradient id={gradId} x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor={color} stopOpacity="0.22"/>
              <stop offset="100%" stopColor={color} stopOpacity="0.01"/>
            </linearGradient>
          </defs>
          {[0,.25,.5,.75,1].map((ratio,i)=>{const gy=pad.top+graphHeight*ratio;const val=maxValue*(1-ratio);return <g key={i}>
            <line x1={pad.left} x2={chartWidth-pad.right} y1={gy} y2={gy} stroke="#e2e8f0" strokeDasharray={i===4?"0":"4 5"}/>
            <text x={pad.left-10} y={gy+4} textAnchor="end" fontSize="10" fill="#94a3b8">{fmtCompact(val)}</text>
          </g>})}
          <path d={areaPath} fill={`url(#${gradId})`}/>
          <path d={linePath} fill="none" stroke={color} strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"/>
          {points.map((p,i)=>{const px=x(i),py=y(p.revenue);return <g key={`${p.label}-${i}`}>
            <circle cx={px} cy={py} r="7" fill="#fff" stroke={color} strokeWidth="3"><title>{p.label}: {fmt(p.revenue)} ₴, {p.orders} замовлень</title></circle>
            <text x={px} y={Math.max(17,py-13)} textAnchor="middle" fontSize="10" fontWeight="800" fill="#334155">{fmtCompact(p.revenue)}</text>
            <text x={px} y={chartHeight-34} textAnchor="middle" fontSize="10" fontWeight="700" fill="#64748b">{p.label}</text>
            <text x={px} y={chartHeight-17} textAnchor="middle" fontSize="9" fill="#94a3b8">{p.orders} зам.</text>
          </g>})}
        </svg>
      </div>
      <div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>Наведіть на точку, щоб побачити виручку й кількість замовлень. На мобільному графік можна гортати горизонтально.</div>
    </div>
  );
}

function ForecastBlock({project}){
  const f=FORECAST_DATA[project];
  if(!f)return null;
  const mid=f.mid||f.low.map((v,i)=>Math.round((v+f.high[i])/2));
  const sum=a=>a.reduce((s,v)=>s+v,0);
  const sumLow=sum(f.low),sumMid=sum(mid),sumHigh=sum(f.high),avgMid=Math.round(sumMid/mid.length);
  const actual=f.actual||[];
  const labels=[...actual.map(d=>d.label),...f.months];
  const chartWidth=Math.max(860,labels.length*86),chartHeight=330;
  const pad={left:76,right:28,top:38,bottom:70};
  const graphWidth=chartWidth-pad.left-pad.right,graphHeight=chartHeight-pad.top-pad.bottom;
  const maxValue=Math.max(...actual.map(d=>d.revenue),...f.high,1)*1.08;
  const x=i=>pad.left+(labels.length===1?graphWidth/2:i*graphWidth/(labels.length-1));
  const y=v=>pad.top+graphHeight-(v/maxValue)*graphHeight;
  const actualPath=actual.map((p,i)=>`${i===0?"M":"L"} ${x(i)} ${y(p.revenue)}`).join(" ");
  const bridgeIndex=Math.max(0,actual.length-1),lastActual=actual[bridgeIndex]?.revenue||mid[0]||0;
  const forecastIndexes=f.months.map((_,i)=>actual.length+i);
  const highPath=[`M ${x(bridgeIndex)} ${y(lastActual)}`,...forecastIndexes.map((idx,i)=>`L ${x(idx)} ${y(f.high[i])}`)].join(" ");
  const lowPath=[`M ${x(bridgeIndex)} ${y(lastActual)}`,...forecastIndexes.map((idx,i)=>`L ${x(idx)} ${y(f.low[i])}`)].join(" ");
  const midPath=[`M ${x(bridgeIndex)} ${y(lastActual)}`,...forecastIndexes.map((idx,i)=>`L ${x(idx)} ${y(mid[i])}`)].join(" ");
  const areaPath=[`M ${x(bridgeIndex)} ${y(lastActual)}`,...forecastIndexes.map((idx,i)=>`L ${x(idx)} ${y(f.high[i])}`),...forecastIndexes.slice().reverse().map((idx,ri)=>{const i=forecastIndexes.length-1-ri;return `L ${x(idx)} ${y(f.low[i])}`}),"Z"].join(" ");
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:16,flexWrap:"wrap",marginBottom:14}}>
        <div><div style={{fontSize:20,fontWeight:900,letterSpacing:"-0.03em",color:"#0f172a"}}>{f.title}</div><div style={{fontSize:12,color:"#64748b",marginTop:5}}>Факт залишається у верхній частині дашборда · нижче — сценарний план наступних місяців</div></div>
        <div style={{background:"#ecfdf5",border:"1px solid #a7f3d0",borderRadius:10,padding:"8px 12px",fontSize:11,fontWeight:800,color:"#047857"}}>Плановий горизонт: 5 місяців</div>
      </div>

      <div className="forecast-kpis" style={{display:"grid",gridTemplateColumns:"repeat(4,minmax(0,1fr))",gap:10,marginBottom:14}}>
        {[
          {label:f.lowLabel,value:sumLow,color:"#64748b",sub:"нижня межа плану"},
          {label:f.midLabel,value:sumMid,color:"#059669",sub:"робочий сценарій"},
          {label:f.highLabel,value:sumHigh,color:"#0f766e",sub:"верхня межа"},
          {label:"Середньомісячний план",value:avgMid,color:"#0f172a",sub:"за робочим сценарієм"}
        ].map(k=><div key={k.label} style={{background:"#fff",border:"1px solid #e2e8f0",borderTop:`4px solid ${k.color}`,borderRadius:14,padding:"15px 16px"}}><div style={{fontSize:10,fontWeight:800,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".04em"}}>{k.label}</div><div style={{fontSize:21,fontWeight:900,color:k.color,marginTop:7,letterSpacing:"-0.03em"}}>{fmtCompact(k.value)} ₴</div><div style={{fontSize:10,color:"#94a3b8",marginTop:4}}>{k.sub}</div></div>)}
      </div>

      <div className="forecast-method" style={{display:"flex",gap:14,alignItems:"flex-start",background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:14,padding:"14px 16px",marginBottom:16}}><div style={{width:34,height:34,borderRadius:10,background:"#e0f2fe",display:"grid",placeItems:"center",fontSize:17,flex:"0 0 auto"}}>🧮</div><div><div style={{fontSize:12,fontWeight:900,color:"#0f172a"}}>{f.methodTitle}</div><div style={{fontSize:11,lineHeight:1.55,color:"#64748b",marginTop:4}}>{f.method}</div></div></div>

      <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:16,padding:"18px 18px 12px",marginBottom:16,boxShadow:"0 8px 24px rgba(15,23,42,.04)"}}>
        <div style={{fontSize:15,fontWeight:900,color:"#0f172a"}}>Факт і прогнозний коридор</div><div style={{fontSize:11,color:"#94a3b8",marginTop:4,marginBottom:8}}>Синя лінія — факт · зелена лінія — робочий план · зафарбована зона — допустимий коридор</div>
        <div style={{overflowX:"auto",overflowY:"hidden",WebkitOverflowScrolling:"touch"}}><svg width="100%" height={chartHeight} viewBox={`0 0 ${chartWidth} ${chartHeight}`} style={{display:"block",minWidth:chartWidth}}>
          {[0,.25,.5,.75,1].map((ratio,i)=>{const gy=pad.top+graphHeight*ratio,val=maxValue*(1-ratio);return <g key={i}><line x1={pad.left} x2={chartWidth-pad.right} y1={gy} y2={gy} stroke="#e2e8f0" strokeDasharray={i===4?"0":"4 5"}/><text x={pad.left-10} y={gy+4} textAnchor="end" fontSize="10" fill="#94a3b8">{fmtCompact(val)}</text></g>})}
          <line x1={x(bridgeIndex)+42} x2={x(bridgeIndex)+42} y1={pad.top} y2={pad.top+graphHeight} stroke="#cbd5e1" strokeDasharray="5 5"/><text x={x(bridgeIndex)+50} y={pad.top+12} fontSize="10" fontWeight="800" fill="#94a3b8">ПРОГНОЗ →</text>
          <path d={areaPath} fill="rgba(16,185,129,.15)"/>{actualPath&&<path d={actualPath} fill="none" stroke="#2563eb" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"/>}<path d={highPath} fill="none" stroke="#10b981" strokeWidth="1.5" strokeDasharray="5 4"/><path d={lowPath} fill="none" stroke="#10b981" strokeWidth="1.5" strokeDasharray="5 4"/><path d={midPath} fill="none" stroke="#059669" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"/>
          {actual.map((p,i)=><g key={`a-${i}`} style={{cursor:"help"}}><title>{`${p.label} · Факт: ${fmt(p.revenue)} ₴`}</title><circle cx={x(i)} cy={y(p.revenue)} r="13" fill="transparent"/><circle cx={x(i)} cy={y(p.revenue)} r="6" fill="#fff" stroke="#2563eb" strokeWidth="3"/><text x={x(i)} y={Math.max(17,y(p.revenue)-13)} textAnchor="middle" fontSize="9" fontWeight="800" fill="#334155">{fmtCompact(p.revenue)}</text></g>)}
          {f.months.map((m,i)=>{const idx=actual.length+i,prev=i===0?lastActual:mid[i-1],growth=prev>0?((mid[i]/prev-1)*100):0;return <g key={m} style={{cursor:"help"}}><title>{`${m} · Робочий план: ${fmt(mid[i])} ₴ · Коридор: ${fmt(f.low[i])}–${fmt(f.high[i])} ₴ · Зростання: ${growth>=0?"+":""}${growth.toFixed(1)}% MoM`}</title><circle cx={x(idx)} cy={y(mid[i])} r="14" fill="transparent"/><circle cx={x(idx)} cy={y(mid[i])} r="6" fill="#fff" stroke="#059669" strokeWidth="3"/><text x={x(idx)} y={Math.max(17,y(mid[i])-13)} textAnchor="middle" fontSize="9" fontWeight="800" fill="#047857">{fmtCompact(mid[i])}</text></g>})}
          {labels.map((l,i)=><text key={l} x={x(i)} y={chartHeight-34} textAnchor="middle" fontSize="10" fontWeight={i>=actual.length?"800":"700"} fill={i>=actual.length?"#047857":"#64748b"}>{l}</text>)}
          {f.months.map((m,i)=>{const idx=actual.length+i;return <text key={`${m}-r`} x={x(idx)} y={chartHeight-17} textAnchor="middle" fontSize="8.5" fill="#94a3b8">{fmtCompact(f.low[i])}–{fmtCompact(f.high[i])}</text>})}
        </svg></div>
        <div style={{fontSize:10,color:"#94a3b8",marginTop:4}}>Наведіть на синю або зелену точку: з’являться точна сума, прогнозний коридор і зростання до попереднього місяця.</div>
      </div>

      <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:16,padding:"18px",marginBottom:16}}><div style={{fontSize:15,fontWeight:900,color:"#0f172a"}}>Факт → план по місяцях</div><div style={{fontSize:11,color:"#94a3b8",marginTop:4,marginBottom:12}}>Останні фактичні місяці показані синім, прогноз із серпня — зеленим</div><div className="forecast-months" style={{display:"grid",gridTemplateColumns:`repeat(${Math.min(4,(actual.slice(-3).length+f.months.length))},minmax(0,1fr))`,gap:9}}>{actual.slice(-3).map(d=><div key={`fact-${d.label}`} style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:12,padding:"13px 12px"}}><div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"center"}}><div style={{fontSize:10,fontWeight:900,color:"#1d4ed8",textTransform:"uppercase"}}>{d.label}</div><div style={{fontSize:9,fontWeight:900,color:"#2563eb",background:"#dbeafe",borderRadius:999,padding:"3px 6px"}}>ФАКТ</div></div><div style={{fontSize:19,fontWeight:900,color:"#2563eb",marginTop:7}}>{fmt(d.revenue)} ₴</div><div style={{fontSize:10,color:"#64748b",marginTop:5}}>оплачені роздрібні продажі</div></div>)}{f.months.map((m,i)=><div key={m} style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:12,padding:"13px 12px"}}><div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"center"}}><div style={{fontSize:10,fontWeight:900,color:"#047857",textTransform:"uppercase"}}>{m}</div><div style={{fontSize:9,fontWeight:900,color:"#047857",background:"#dcfce7",borderRadius:999,padding:"3px 6px"}}>ПЛАН</div></div><div style={{fontSize:19,fontWeight:900,color:"#059669",marginTop:7}}>{fmt(mid[i])} ₴</div><div style={{fontSize:10,color:"#64748b",marginTop:5}}>коридор {fmt(f.low[i])}–{fmt(f.high[i])} ₴</div></div>)}</div></div>

    </div>
  );
}

                        {googleMonths.map((m,mi)=>{const d=(pData[m].googleAds.rows||[]).find(r=>r.name===groupName);const bg=mColors[m]+"06";const isL=mi<googleMonths.length-1;if(!d)return<><Dash bg={bg}/><Dash bg={bg}/><Dash bg={bg}/><Dash bg={bg}/><Dash bg={bg}/><Dash bg={bg}/><Dash bg={bg}/><Dash bg={bg}/><Dash bg={bg}/><Dash bg={bg} br={isL}/></>;
                          const cpc=d.clicks>0?d.cost/d.clicks:0;const cpa=d.purchases>0?d.cost/d.purchases:0;const roas=d.conversionValue>0?d.conversionValue/d.cost:0;const drr=d.conversionValue>0?(d.cost/d.conversionValue)*100:0;
                          return<><Td key={m+"i"} align="right" bg={bg}>{fmt(d.impressions)}</Td><Td key={m+"cl"} align="right" bg={bg}>{fmt(d.clicks)}</Td><Td key={m+"ctr"} align="right" bg={bg}>{fmtPct(d.ctr)}</Td><Td key={m+"s"} align="right" bold bg={bg}>{fmt(Math.round(d.cost))} ₴</Td><Td key={m+"cpc"} align="right" bg={bg}>{cpc?`${fmt(Math.round(cpc))} ₴`:"—"}</Td><Td key={m+"p"} align="center" bold bg={bg}>{d.purchases||"—"}</Td><Td key={m+"cpa"} align="right" bold bg={bg}>{cpa?`${fmt(Math.round(cpa))} ₴`:"—"}</Td><Td key={m+"v"} align="right" bold bg={bg}>{d.conversionValue?`${fmt(Math.round(d.conversionValue))} ₴`:"—"}</Td><RoasCell key={m+"ro"} val={roas}/><DrrCell key={m+"d"} val={drr>0?drr:null} br={isL}/></>;
                        })}
                      </tr>
                    ))}
                    <tr style={{borderTop:"2px solid #334155",background:"#f8fafc"}}>
                      <STd bg="#f8fafc"><strong>Всього</strong></STd>
                      {googleMonths.map((m,mi)=>{const list=pData[m].googleAds.rows||[];const isL=mi<googleMonths.length-1;const impressions=list.reduce((sum,r)=>sum+r.impressions,0);const clicks=list.reduce((sum,r)=>sum+r.clicks,0);const cost=list.reduce((sum,r)=>sum+r.cost,0);const purchases=list.reduce((sum,r)=>sum+r.purchases,0);const value=list.reduce((sum,r)=>sum+r.conversionValue,0);const ctr=impressions>0?(clicks/impressions)*100:0;const cpc=clicks>0?cost/clicks:0;const cpa=purchases>0?cost/purchases:0;const roas=value>0?value/cost:0;const drr=value>0?(cost/value)*100:0;
                        return<><Td key={m+"i"} align="right" bold bg="#f8fafc">{fmt(impressions)}</Td><Td key={m+"cl"} align="right" bold bg="#f8fafc">{fmt(clicks)}</Td><Td key={m+"ctr"} align="right" bold bg="#f8fafc">{fmtPct(ctr)}</Td><Td key={m+"s"} align="right" bold bg="#f8fafc">{fmt(Math.round(cost))} ₴</Td><Td key={m+"cpc"} align="right" bold bg="#f8fafc">{fmt(Math.round(cpc))} ₴</Td><Td key={m+"p"} align="center" bold bg="#f8fafc">{purchases}</Td><Td key={m+"cpa"} align="right" bold bg="#f8fafc">{fmt(Math.round(cpa))} ₴</Td><Td key={m+"v"} align="right" bold bg="#f8fafc">{fmt(Math.round(value))} ₴</Td><RoasCell key={m+"ro"} val={roas}/><Td key={m+"d"} align="center" bold bg="#f8fafc" br={isL}>{fmtPct(drr)}</Td></>;
                      })}
                    </tr>
                  </tbody>
                </table>
              </div></>}
              {hasLeadCamps&&<><SectionLabel>📋 Кампанії на ліди</SectionLabel>
              <div style={{fontSize:11,color:"#64748b",margin:"-4px 0 10px"}}>
                Витрати та ліди — з Meta Ads. {project==="YouJoy"?"Фактичні продажі й виручка додані з адмінки; кампанію «Усі товари» об’єднано зі «Сканерами».":""}
              </div>
              <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:14,overflow:"auto"}}>
                <table style={{width:"100%",minWidth:Math.max(1100,months.length*900),borderCollapse:"collapse"}}>
                  <thead>
                    <tr><Th sticky bg="#fff"></Th>{months.map(m=>{const mc=mColors[m];return <th key={m} colSpan={8} style={{textAlign:"center",padding:"10px 0 6px",borderBottom:`3px solid ${mc}`,background:`${mc}08`}}><MonthBadge label={pData[m].label} color={mc}/></th>})}</tr>
                    <tr style={{borderBottom:"1px solid #e2e8f0"}}><Th sticky bg="#fff">Категорія кампанії</Th>{months.map(m=>{const bg=mColors[m]+"06";return<><Th key={m+"s"} align="right" bg={bg}>Витрати</Th><Th key={m+"l"} align="center" bg={bg}>Ліди</Th><Th key={m+"cpl"} align="right" bg={bg}>CPL</Th><Th key={m+"p"} align="center" bg={bg}>Продажі</Th><Th key={m+"cpa"} align="right" bg={bg}>CPA</Th><Th key={m+"rv"} align="right" bg={bg}>Виручка</Th><Th key={m+"ro"} align="center" bg={bg}>ROAS</Th><Th key={m+"d"} align="center" bg={bg}>ДРР</Th></>})}</tr>
                  </thead>
                  <tbody>
                    {leadCampNames.map(campName=>(
                      <tr key={campName} style={{borderBottom:"1px solid #f1f5f9"}}>
                        <STd>{campName}</STd>
                        {months.map((m,mi)=>{const d=getLeadRows(m).find(c=>c.name===campName);const bg=mColors[m]+"06";const isL=mi<months.length-1;if(!d)return<><Dash bg={bg}/><Dash bg={bg}/><Dash bg={bg}/><Dash bg={bg}/><Dash bg={bg}/><Dash bg={bg}/><Dash bg={bg}/><Dash bg={bg} br={isL}/></>;
                          const sp=Math.round(d.spentUSD*USD);const cpl=d.results>0?Math.round(sp/d.results):0;const purchases=d.purchases||0;const rev=d.rev||0;const cpa=purchases>0?Math.round(sp/purchases):0;const roas=rev>0?rev/sp:0;const drr=rev>0?(sp/rev)*100:0;
                          return<><Td key={m+"s"} align="right" bold bg={bg}>{fmt(sp)} ₴</Td><Td key={m+"l"} align="center" bold bg={bg}>{d.results||"—"}</Td><Td key={m+"cpl"} align="right" bold bg={bg}>{cpl?`${fmt(cpl)} ₴`:"—"}</Td><Td key={m+"p"} align="center" bold bg={bg}>{purchases||"—"}</Td><Td key={m+"cpa"} align="right" bold bg={bg}>{cpa?`${fmt(cpa)} ₴`:"—"}</Td><Td key={m+"rv"} align="right" bold bg={bg}>{rev?`${fmt(rev)} ₴`:"—"}</Td><RoasCell key={m+"ro"} val={roas}/><DrrCell key={m+"d"} val={drr>0?drr:null} br={isL}/></>;
                        })}
                      </tr>
                    ))}
                    <tr style={{borderTop:"2px solid #334155",background:"#f8fafc"}}>
                      <STd bg="#f8fafc"><strong>Всього</strong></STd>
                      {months.map((m,mi)=>{const list=getLeadRows(m);const isL=mi<months.length-1;if(!list.length)return<><Dash bg="#f8fafc"/><Dash bg="#f8fafc"/><Dash bg="#f8fafc"/><Dash bg="#f8fafc"/><Dash bg="#f8fafc"/><Dash bg="#f8fafc"/><Dash bg="#f8fafc"/><Dash bg="#f8fafc" br={isL}/></>;
                        const tSp=Math.round(list.reduce((sum,c)=>sum+c.spentUSD,0)*USD);const tLeads=list.reduce((sum,c)=>sum+(c.results||0),0);const tPurch=list.reduce((sum,c)=>sum+(c.purchases||0),0);const tRev=list.reduce((sum,c)=>sum+(c.rev||0),0);const cpl=tLeads>0?Math.round(tSp/tLeads):0;const cpa=tPurch>0?Math.round(tSp/tPurch):0;const roas=tRev>0?tRev/tSp:0;const drr=tRev>0?(tSp/tRev)*100:0;
                        return<><Td key={m+"s"} align="right" bold bg="#f8fafc">{fmt(tSp)} ₴</Td><Td key={m+"l"} align="center" bold bg="#f8fafc">{tLeads||"—"}</Td><Td key={m+"cpl"} align="right" bold bg="#f8fafc">{cpl?`${fmt(cpl)} ₴`:"—"}</Td><Td key={m+"p"} align="center" bold bg="#f8fafc">{tPurch||"—"}</Td><Td key={m+"cpa"} align="right" bold bg="#f8fafc">{cpa?`${fmt(cpa)} ₴`:"—"}</Td><Td key={m+"rv"} align="right" bold bg="#f8fafc">{tRev?`${fmt(tRev)} ₴`:"—"}</Td><RoasCell key={m+"ro"} val={roas}/><Td key={m+"d"} align="center" bold bg="#f8fafc" br={isL}>{drr?fmtPct(drr):"—"}</Td></>;
                      })}
                    </tr>
                  </tbody>
                </table>
              </div></>}
              {months.some(m=>pData[m].traffic)&&<><SectionLabel>📈 Трафік</SectionLabel>
              <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:14,overflow:"hidden"}}>
                <table style={{width:"100%",borderCollapse:"collapse"}}>
                  <thead><tr style={{borderBottom:"1px solid #e2e8f0"}}><Th>Місяць</Th><Th align="right">Витрати</Th><Th align="right">Охоплення</Th><Th align="right">Кліки</Th><Th align="right">CPC</Th></tr></thead>
                  <tbody>{months.map((m,i)=>{const d=pData[m].traffic;const mc=mColors[m];
                    if(!d)return <tr key={m} style={{borderBottom:"1px solid #f1f5f9"}}><Td><MonthBadge label={pData[m].label} color={mc}/></Td><Dash/><Dash/><Dash/><Dash/></tr>;
                    const sp=Math.round(d.spentUSD*USD);const cpc=d.clicks>0?Math.round(sp/d.clicks):0;
                    return <tr key={m} style={{borderBottom:i<months.length-1?"1px solid #f1f5f9":"none"}}><Td><MonthBadge label={pData[m].label} color={mc}/></Td><Td align="right" bold>{fmt(sp)} ₴</Td><Td align="right">{fmt(d.reach)}</Td><Td align="right">{d.clicks?fmt(d.clicks):"—"}</Td><Td align="right">{cpc?`${fmt(cpc)} ₴`:"—"}</Td></tr>;
                  })}</tbody>
                </table>
              </div></>}
              <div style={{marginTop:10,fontSize:10,color:"#94a3b8"}}>* Meta Ads: витрати конвертовані за курсом {USD} ₴/$. {project==="SOCO"?"Google Ads: витрати у звіті вже в UAH.":""}</div>
            </div>
          )}
          {tab==="forecast"&&<ForecastBlock project={project}/>}
        </>}
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));root.render(<Dashboard/>);</script></body></html>
