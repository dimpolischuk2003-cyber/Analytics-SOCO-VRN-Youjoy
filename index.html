<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sales Dashboard · VRN / SOCO / YouJoy</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#f8fafc;--green:#059669;
  --orange:#ea580c;--blue:#2563eb;--red:#dc2626;--violet:#7c3aed;
}
*{box-sizing:border-box}
body{margin:0;background:#f8fafc;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
button:hover{opacity:.92}
.shell{max-width:1220px;margin:0 auto;padding:26px 18px 64px}
.header{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:18px}
.h1{font-size:26px;font-weight:900;letter-spacing:-.04em;margin:0}
.sub{font-size:12px;color:var(--muted);margin-top:5px}
.project-tabs,.tabs,.month-tabs{display:flex;gap:6px;overflow:auto;scrollbar-width:none}
.project-tabs::-webkit-scrollbar,.tabs::-webkit-scrollbar,.month-tabs::-webkit-scrollbar{display:none}
.pbtn,.tabbtn,.mbtn{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#64748b;border-radius:10px;cursor:pointer;font-weight:800}
.pbtn{padding:9px 20px;font-size:14px}
.pbtn.active{background:#0f172a;color:#fff;border-color:#0f172a}
.tabs{margin:14px 0 16px}
.tabbtn{padding:9px 14px;font-size:12px}
.tabbtn.active{background:#fff;color:#0f172a;border-color:#94a3b8;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.month-strip{display:flex;gap:10px;overflow:auto;padding:2px 1px 10px;scrollbar-width:thin;margin-bottom:12px}
.month-card{min-width:210px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 15px 13px;position:relative;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.month-card.partial{border-color:#bfdbfe;background:linear-gradient(180deg,#eff6ff 0,#fff 45%)}
.month-label{font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
.month-rev{font-size:24px;font-weight:900;letter-spacing:-.04em;margin:8px 0 5px}
.month-meta{font-size:11px;color:#64748b;display:flex;gap:12px}
.badge{display:inline-flex;align-items:center;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900;background:#dbeafe;color:#1d4ed8;margin-left:6px;vertical-align:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.section{margin-top:14px}
.section-title{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}
.section-title h2{font-size:15px;margin:0;font-weight:900}
.section-title p{font-size:11px;color:#94a3b8;margin:3px 0 0}
.monitor{border:1px solid #bfdbfe;background:linear-gradient(135deg,#eff6ff 0%,#fff 58%);padding:18px}
.monitor-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.monitor-title{font-size:17px;font-weight:900;letter-spacing:-.02em}
.monitor-note{font-size:11px;color:#64748b;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.kpi{background:rgba(255,255,255,.85);border:1px solid #dbeafe;border-radius:12px;padding:11px}
.kpi-label{font-size:10px;color:#64748b;font-weight:700}
.kpi-value{font-size:19px;font-weight:900;margin-top:5px;letter-spacing:-.03em}
.kpi-sub{font-size:10px;color:#64748b;margin-top:4px;line-height:1.35}
.pos{color:#059669}.neg{color:#dc2626}.neutral{color:#64748b}
.progress-wrap{margin-top:13px;background:#fff;border:1px solid #dbeafe;border-radius:12px;padding:12px}
.progress-top{display:flex;justify-content:space-between;font-size:10px;color:#64748b;margin-bottom:7px}
.progress{height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden}
.progress>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#2563eb,#10b981)}
.plan-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.plan-mini>div{font-size:10px;color:#64748b;background:#f8fafc;border-radius:9px;padding:8px}
.plan-mini strong{display:block;color:#0f172a;font-size:12px;margin-top:2px}
.trend-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}
.toggle{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.toggle button{border:0;background:#fff;padding:6px 10px;font-size:10px;font-weight:800;color:#64748b;cursor:pointer}
.toggle button.active{background:#0f172a;color:#fff}
.chart-scroll{overflow-x:auto}
.chart-box{min-width:680px;position:relative}
svg{display:block;width:100%}
.tooltip{position:absolute;pointer-events:none;transform:translate(-50%,-110%);background:#0f172a;color:#fff;padding:7px 9px;border-radius:8px;font-size:10px;line-height:1.4;white-space:nowrap;box-shadow:0 6px 20px rgba(15,23,42,.18)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}
table{border-collapse:collapse;width:100%;min-width:720px;background:#fff}
th,td{padding:10px 11px;border-bottom:1px solid #eef2f7;text-align:right;font-size:11px}
th{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;background:#f8fafc;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.cat-name{display:flex;gap:8px;align-items:center;font-weight:800}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.total-row td{font-weight:900;background:#f8fafc}
.pipeline{border-color:#fed7aa;background:#fff7ed}
.pipeline-grid{display:grid;grid-template-columns:1.15fr 2fr;gap:12px}
.pipeline-main{background:#fff;border:1px solid #fed7aa;border-radius:12px;padding:14px}
.pipeline-main .big{font-size:25px;font-weight:900;color:#c2410c;margin-top:4px}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.status{background:#fff;border:1px solid #fed7aa;border-radius:10px;padding:10px}
.status b{display:block;font-size:14px;margin-top:3px}
.alert{border:1px solid #fecaca;background:#fef2f2;color:#991b1b;border-radius:12px;padding:11px;font-size:11px}
.empty{padding:30px;text-align:center;color:#94a3b8;border:1px dashed #cbd5e1;border-radius:13px;background:#fff}
.ads-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.ads-kpis .kpi{border-color:var(--line)}
.forecast-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.forecast-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.forecast-card .v{font-size:20px;font-weight:900;margin-top:5px}
.method{padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);font-size:11px;color:#64748b;line-height:1.5;margin-bottom:12px}
.method b{color:#0f172a}
.month-plan-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.plan-month{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.plan-month .name{font-size:10px;color:#64748b;font-weight:800}
.plan-month .mid{font-size:15px;font-weight:900;margin:5px 0}
.plan-month .range{font-size:9px;color:#94a3b8}
.note{font-size:10px;color:#94a3b8;line-height:1.45}
@media(max-width:900px){.kpis,.ads-kpis,.forecast-grid{grid-template-columns:repeat(2,1fr)}.pipeline-grid{grid-template-columns:1fr}.month-plan-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){
 .shell{padding:16px 10px 44px}.header{align-items:flex-start;flex-direction:column}.h1{font-size:22px}.project-tabs{width:100%}
 .kpis,.ads-kpis,.forecast-grid{grid-template-columns:1fr 1fr}.monitor{padding:14px}.monitor-head{flex-direction:column}
 .status-grid{grid-template-columns:1fr}.month-card{min-width:190px}.month-plan-grid{grid-template-columns:1fr 1fr}
 .tabs{width:100%}.tabbtn{flex:1}
}
@media(max-width:420px){.kpis,.ads-kpis,.forecast-grid{grid-template-columns:1fr}.month-plan-grid{grid-template-columns:1fr}}

/* --- Management analytics blocks --- */
.insight-panel{border-color:#cbd5e1;background:linear-gradient(135deg,#ffffff 0%,#f8fafc 100%)}
.insight-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.insight-item{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.insight-item .eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:#64748b;font-weight:900}
.insight-item b{display:block;font-size:13px;margin:5px 0 4px;line-height:1.25}
.insight-item p{margin:0;color:#64748b;font-size:10px;line-height:1.5}
.driver-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.driver-col{border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px}
.driver-col-title{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11px;font-weight:900;margin-bottom:9px}
.driver-row{padding:8px 0;border-bottom:1px solid #f1f5f9}
.driver-row:last-child{border-bottom:0}
.driver-top{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:10px}
.driver-name{font-weight:800;color:#334155}
.driver-delta{font-weight:900;white-space:nowrap}
.driver-meta{font-size:9px;color:#94a3b8;margin-top:3px}
.driver-track{height:5px;background:#f1f5f9;border-radius:99px;overflow:hidden;margin-top:6px}
.driver-track>div{height:100%;border-radius:99px}
.driver-track .up{background:#10b981}.driver-track .down{background:#f87171}
.quadrant-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quadrant{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;min-height:150px}
.quadrant.q1{border-top:3px solid #10b981}.quadrant.q2{border-top:3px solid #3b82f6}.quadrant.q3{border-top:3px solid #f59e0b}.quadrant.q4{border-top:3px solid #94a3b8}
.quadrant-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:9px}
.quadrant-head b{font-size:11px;line-height:1.35}.quadrant-tag{font-size:8px;font-weight:900;border-radius:999px;padding:4px 7px;background:#f1f5f9;color:#475569;white-space:nowrap}
.quadrant ul{margin:0;padding-left:16px;color:#475569;font-size:10px;line-height:1.55}
.quadrant li+li{margin-top:5px}
.quadrant-note{font-size:9px;color:#94a3b8;margin-top:9px;line-height:1.45}
@media(max-width:900px){.insight-grid{grid-template-columns:1fr}.driver-grid,.quadrant-grid{grid-template-columns:1fr}}
</style>
</head>

const USD=44;

const fmt=(n)=>Math.round(Number(n)||0).toLocaleString("uk-UA");
const money=(n)=>`${fmt(n)} ₴`;
const pct=(n)=>`${n>0?"+":""}${Number(n).toFixed(1)}%`;
const compact=(n)=>{
  n=Number(n)||0;
  if(Math.abs(n)>=1000000)return `${(n/1000000).toFixed(n>=10000000?1:2)} млн`;
  if(Math.abs(n)>=1000)return `${(n/1000).toFixed(n>=100000?0:1)} тис.`;
  return fmt(n);
};

const monthOrder=["jun25","jul25","aug25","sep25","oct25","nov25","dec25","jan26","feb26","mar26","apr26","may26","apr","may","jun","jul","aug"];

const getMonthKeys=(project)=>Object.keys(DATA[project]||{}).sort((a,b)=>monthOrder.indexOf(a)-monthOrder.indexOf(b));
const hasAdData=(d)=>Boolean((d?.camps&&d.camps.length)||(d?.leadCamps&&d.leadCamps.length)||d?.leads||(d?.googleAds&&(d.googleAds.rows||d.googleAds.summaryOnly)));

function LineChart({items,color="#2563eb",height=250,planValue=null}){
  const [hover,setHover]=useState(null);
  if(!items.length)return null;
  const W=Math.max(760,items.length*78),H=height, pad={l:58,r:24,t:28,b:48};
  const vals=items.map(x=>x.value);
  if(planValue) vals.push(planValue);
  const min=0,max=Math.max(...vals)*1.08||1;
  const x=i=>pad.l+(W-pad.l-pad.r)*(items.length===1 ? 0.5 : i/(items.length-1));
  const y=v=>pad.t+(H-pad.t-pad.b)*(1-v/max);
  const pts=items.map((d,i)=>`${x(i)},${y(d.value)}`).join(" ");
  const ticks=4;
  return <div className="chart-scroll"><div className="chart-box" style={{width:W}}>
    <svg viewBox={`0 0 ${W} ${H}`} style={{height:H}}>
      {[0,1,2,3,4].map(i=>{
        const val=max*(i/ticks), yy=y(val);
        return <g key={i}><line x1={pad.l} y1={yy} x2={W-pad.r} y2={yy} stroke="#e2e8f0" strokeDasharray="4 5"/>
          <text x={pad.l-8} y={yy+3} textAnchor="end" fontSize="9" fill="#94a3b8">{compact(val)}</text></g>
      })}
      {planValue && <g><line x1={pad.l} y1={y(planValue)} x2={W-pad.r} y2={y(planValue)} stroke="#10b981" strokeDasharray="8 5"/>
        <text x={W-pad.r} y={y(planValue)-6} textAnchor="end" fontSize="9" fill="#059669">План {compact(planValue)}</text></g>}
      <polyline fill="none" stroke={color} strokeWidth="3" strokeLinejoin="round" strokeLinecap="round" points={pts}/>
      {items.map((d,i)=><g key={i}>
        <circle cx={x(i)} cy={y(d.value)} r="5.5" fill="#fff" stroke={d.partial?"#2563eb":color} strokeWidth="3"
          onMouseEnter={()=>setHover({i,d})} onMouseLeave={()=>setHover(null)} style={{cursor:"pointer"}}/>
        <text x={x(i)} y={H-20} textAnchor="middle" fontSize="9" fill="#64748b">{d.label}</text>
        <text x={x(i)} y={Math.max(16,y(d.value)-11)} textAnchor="middle" fontSize="9" fontWeight="800" fill="#334155">{compact(d.value)}</text>
      </g>)}
    </svg>
    {hover && <div className="tooltip" style={{left:x(hover.i),top:y(hover.d.value)}}>
      <b>{hover.d.label}</b><br/>{money(hover.d.value)}
      {hover.d.orders!==undefined && <><br/>{hover.d.orders} замовлень</>}
      {hover.d.partial && <><br/><span style={{color:"#93c5fd"}}></span></>}
    </div>}
  </div></div>
}

function MonthOverview({project,selectedMonth}){
  const data=DATA[project],d=data[selectedMonth];
  if(!d)return null;
  const keys=getMonthKeys(project),idx=keys.indexOf(selectedMonth),prev=idx>0?data[keys[idx-1]]:null;
  const revChange=prev&&prev.revenue?((d.revenue/prev.revenue)-1)*100:null;
  const orderChange=prev&&prev.orders?((d.orders/prev.orders)-1)*100:null;
  const unpaid=d.unpaid||null,cancelled=d.cancelled||null;
  const plan=null;
  return <div className="card monitor section">
    <div className="monitor-head">
      <div><div className="monitor-title">{d.label} · результати місяця</div><div className="monitor-note">Факт — тільки оплачені роздрібні замовлення. ОПТ виключено.</div></div>
      <div style={{fontSize:10,color:"#64748b",background:"#fff",border:"1px solid #dbeafe",padding:"6px 8px",borderRadius:8}}>{hasAdData(d)?"Є рекламні дані":"Реклама не завантажена"}</div>
    </div>
    <div className="kpis">
      <div className="kpi"><div className="kpi-label">Виручка</div><div className="kpi-value">{money(d.revenue)}</div><div className="kpi-sub">{fmt(d.orders)} замовлень</div></div>
      <div className="kpi"><div className="kpi-label">Середній чек</div><div className="kpi-value">{money(d.aov)}</div><div className="kpi-sub">оплачені роздрібні</div></div>
      <div className="kpi"><div className="kpi-label">vs попереднього місяця</div><div className={`kpi-value ${revChange===null?"":revChange>=0?"pos":"neg"}`}>{revChange===null?"—":pct(revChange)}</div><div className="kpi-sub">{prev?`${prev.label}: ${money(prev.revenue)} · замовлення ${orderChange===null?"—":pct(orderChange)}`:"немає попереднього місяця в історії"}</div></div>
      <div className="kpi"><div className="kpi-label">{unpaid?"Неоплачено / в процесі":plan?"Виконання плану":"Виключено"}</div><div className={`kpi-value ${plan&&!unpaid&&d.revenue>=plan?"pos":""}`} style={unpaid?{color:"#c2410c"}:{}}>{unpaid?money(unpaid.revenue):plan?`${(d.revenue/plan*100).toFixed(1)}%`:cancelled&&cancelled.orders?money(cancelled.revenue):"—"}</div><div className="kpi-sub">{unpaid?`${unpaid.orders} замовлень не входять у факт`:plan?`план ${money(plan)}`:cancelled&&cancelled.orders?`${cancelled.orders} анульованих / помилкових`:'окремі дані відсутні'}</div></div>
    </div>
    {plan&&<div className="progress-wrap"><div className="progress-top"><span>Факт до робочого плану</span><b>{(d.revenue/plan*100).toFixed(1)}% · {money(d.revenue)} / {money(plan)}</b></div><div className="progress"><div style={{width:`${Math.min(100,d.revenue/plan*100)}%`}}></div></div></div>}
  </div>
}

function Trend({project,selectedMonth}){
  const [mode,setMode]=useState("monthly");
  const data=DATA[project];
  const keys=getMonthKeys(project);
  const actualMode=selectedMonth==="aug"?mode:"monthly";
  let items=actualMode==="monthly"
    ? keys.map(k=>({label:data[k].label,value:data[k].revenue,orders:data[k].orders}))
    : WEEKLY[project].map(x=>({label:x.label,value:x.revenue,orders:x.orders}));
  return <div className="card section">
    <div className="trend-head"><div><b style={{fontSize:14}}>Динаміка продажів</b><div className="note">{actualMode==="monthly"?"Фактична виручка по місяцях":"Серпень по тижневих відрізках · тільки оплачені роздрібні замовлення"}</div></div>

}

function MonthlyInsights({project,selectedMonth}){
  const data=DATA[project],d=data[selectedMonth];
  if(!d)return null;
  const keys=getMonthKeys(project),idx=keys.indexOf(selectedMonth),prev=idx>0?data[keys[idx-1]]:null;
  const curated=selectedMonth==="aug"?CURRENT_ANALYSIS[project]?.cards:null;
  let cards=curated;
  if(!cards){
    const revChange=prev&&prev.revenue?((d.revenue/prev.revenue)-1)*100:null;
    const orderChange=prev&&prev.orders?((d.orders/prev.orders)-1)*100:null;
    const top=[...(d.cats||[])].sort((a,b)=>b.revenue-a.revenue)[0];
    cards=[
      {kicker:"Продажі",title:prev?`${d.label}: ${revChange>=0?"ріст":"зниження"} виручки ${pct(revChange)}`:`${d.label}: базовий місяць у доступній історії`,text:prev?`Замовлення: ${pct(orderChange)} до ${prev.label.toLowerCase()}. Виручка — ${money(d.revenue)}.`:`Виручка — ${money(d.revenue)}, ${d.orders} оплачених роздрібних замовлень.`},
      {kicker:"Мікс",title:top?`Найбільша категорія — ${top.name}`:"Категорійні дані відсутні",text:top?`${money(top.revenue)} або ${d.revenue?(top.revenue/d.revenue*100).toFixed(1):0}% виручки місяця.`:"Для цього місяця немає деталізації по категоріях."},
      {kicker:"Маркетинг",title:hasAdData(d)?"Рекламні дані за місяць завантажені":"Рекламні дані за місяць ще не завантажені",text:hasAdData(d)?"Деталізацію Meta / Google можна переглянути у вкладці «Реклама».":"Для коректного висновку по каналах потрібен рекламний експорт за цей місяць."}

  </div>

function RevenueDrivers({project,selectedMonth}){
  const data=DATA[project],d=data[selectedMonth];
  const keys=getMonthKeys(project),idx=keys.indexOf(selectedMonth);
  if(!d||idx<=0)return null;
  const prev=data[keys[idx-1]];
  const prevMap=Object.fromEntries((prev.cats||[]).map(c=>[c.name,c.revenue||0]));
  const currMap=Object.fromEntries((d.cats||[]).map(c=>[c.name,c.revenue||0]));
  const names=[...new Set([...Object.keys(prevMap),...Object.keys(currMap)])];
  const rows=names.map(name=>({name,prev:prevMap[name]||0,curr:currMap[name]||0,delta:(currMap[name]||0)-(prevMap[name]||0)}));
  const up=rows.filter(r=>r.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,6);
  const down=rows.filter(r=>r.delta<0).sort((a,b)=>a.delta-b.delta).slice(0,6);
  const maxAbs=Math.max(1,...rows.map(r=>Math.abs(r.delta)));
  const totalDelta=d.revenue-prev.revenue;
  const col=(items,isUp)=><div className="driver-col"><div className="driver-col-title"><span>{isUp?"Що додало виручку":"Що зменшило виручку"}</span><span className={isUp?"pos":"neg"}>{items.length?`${isUp?"+":""}${money(items.reduce((s,r)=>s+r.delta,0))}`:"—"}</span></div>{items.length?items.map((r,i)=><div className="driver-row" key={i}><div className="driver-top"><span className="driver-name">{r.name}</span><span className={`driver-delta ${isUp?"pos":"neg"}`}>{r.delta>0?"+":""}{money(r.delta)}</span></div><div className="driver-meta">{prev.label}: {money(r.prev)} → {d.label}: {money(r.curr)}</div><div className="driver-track"><div className={isUp?"up":"down"} style={{width:`${Math.max(4,Math.abs(r.delta)/maxAbs*100)}%`}}></div></div></div>):<div className="note">Немає категорій із таким типом зміни.</div>}</div>;
  return <div className="card section">
    <div className="section-title"><div><h2>Що сформувало зміну виручки</h2><p>{d.label} проти {prev.label} · загальна зміна <b className={totalDelta>=0?"pos":"neg"}>{totalDelta>=0?"+":""}{money(totalDelta)}</b></p></div></div>
    <div className="driver-grid">{col(up,true)}{col(down,false)}</div>
  </div>
}

function ForecastChart({project}){
  const f=FORECAST[project],aug=DATA[project].aug;
  const items=[
    ...f.actual.map(x=>({label:x.label,value:x.revenue})),
    {label:"Сер 26",value:aug.revenue,orders:aug.orders},
    ...f.months.map((m,i)=>({label:m,value:f.mid[i],forecast:true}))
  ];
  const [hover,setHover]=useState(null);
  const W=Math.max(820,items.length*80),H=270,pad={l:60,r:25,t:28,b:48};
  const vals=[...items.map(x=>x.value),...f.high]; const max=Math.max(...vals)*1.08;
  const x=i=>pad.l+(W-pad.l-pad.r)*(items.length===1 ? 0.5 : i/(items.length-1));
  const y=v=>pad.t+(H-pad.t-pad.b)*(1-v/max);
  const actualEnd=f.actual.length; // index of full August actual
  const actualItems=items.slice(0,actualEnd+1);
  const forecastItems=[items[actualEnd],...items.slice(actualEnd+1)];
  const poly=arr=>arr.map(d=>`${x(items.indexOf(d))},${y(d.value)}`).join(" ");
  return <div className="chart-scroll"><div className="chart-box" style={{width:W}}>
    <svg viewBox={`0 0 ${W} ${H}`} style={{height:H}}>
      {[0,1,2,3,4].map(i=>{const v=max*i/4,yy=y(v);return <g key={i}><line x1={pad.l} y1={yy} x2={W-pad.r} y2={yy} stroke="#e2e8f0" strokeDasharray="4 5"/><text x={pad.l-8} y={yy+3} textAnchor="end" fontSize="9" fill="#94a3b8">{compact(v)}</text></g>})}
      <polyline points={poly(actualItems)} fill="none" stroke="#2563eb" strokeWidth="3"/>
      <polyline points={poly(forecastItems)} fill="none" stroke="#10b981" strokeWidth="3" strokeDasharray="7 5"/>
      {items.map((d,i)=><g key={i}><circle cx={x(i)} cy={y(d.value)} r="5" fill="#fff" stroke={d.forecast?"#10b981":"#2563eb"} strokeWidth="3" onMouseEnter={()=>setHover({i,d})} onMouseLeave={()=>setHover(null)} style={{cursor:"pointer"}}/>
        <text x={x(i)} y={H-20} textAnchor="middle" fontSize="9" fill="#64748b">{d.label}</text></g>)}
    </svg>
    {hover&&<div className="tooltip" style={{left:x(hover.i),top:y(hover.d.value)}}><b>{hover.d.label}</b><br/>{money(hover.d.value)}{hover.d.orders!==undefined&&<><br/>{hover.d.orders} замовлень</>}{hover.d.forecast&&<><br/><span style={{color:"#86efac"}}>робочий план</span></>}</div>}
  </div></div>
}

function ForecastTab({project}){
  const f=FORECAST[project],aug=DATA[project].aug;
  const sepPlan=f.mid[0];
  const mom=(sepPlan/aug.revenue-1)*100;
  const ly=f.sameMonthLY?.[0]||null;
  return <div>
    <div className="card">
      <div className="section-title"><div><h2>{f.title}</h2><p>Серпень — факт; з вересня — оновлений робочий план</p></div></div>
      <div className="method"><b>{f.methodTitle}</b><br/>{f.method}</div>
      <div className="forecast-grid">
        <div className="forecast-card"><div className="kpi-label">Факт серпня</div><div className="v">{money(aug.revenue)}</div><div className="kpi-sub">{aug.orders} оплачених роздрібних замовлень</div></div>
        <div className="forecast-card"><div className="kpi-label">Робочий план вересня</div><div className="v">{money(sepPlan)}</div><div className="kpi-sub">коридор {money(f.low[0])} — {money(f.high[0])}</div></div>
        <div className="forecast-card"><div className="kpi-label">Плановий ріст MoM</div><div className={`v ${mom>=0?"pos":"neg"}`}>{mom>=0?"+":""}{mom.toFixed(1)}%</div><div className="kpi-sub">від факту серпня до робочого плану вересня</div></div>
        <div className="forecast-card"><div className="kpi-label">{ly?"Вересень 2025":"Неоплачений pipeline"}</div><div className="v">{ly?money(ly.revenue):money(aug.unpaid?.revenue||0)}</div><div className="kpi-sub">{ly?`${ly.orders} замовлень · орієнтир сезонності`:`${aug.unpaid?.orders||0} замовлень не входять у факт`}</div></div>
      </div>
      <ForecastChart project={project}/>
      <div className="month-plan-grid">{f.months.map((name,i)=><div className="plan-month" key={name}><div className="name">{name}</div><div className="mid">{money(f.mid[i])}</div><div className="range">{money(f.low[i])} — {money(f.high[i])}</div>{f.sameMonthLY?.[i]&&<div style={{fontSize:9,color:"#64748b",marginTop:5}}>2025: {money(f.sameMonthLY[i].revenue)} · {f.sameMonthLY[i].orders} зам.</div>}</div>)}</div>
    </div>
    <div className="section">
      <div className="section-title"><div><h2>План за категоріями</h2><p>Категорійний мікс прив’язаний до нового загального плану, тому сума категорій відповідає плану місяця.</p></div></div>
      <div className="table-wrap"><table className="forecast-table"><thead><tr><th>Категорія</th>{f.months.map(x=><th key={x}>{x}</th>)}</tr></thead><tbody>
      {f.categories.map((c,i)=><tr key={i}><td><span className="cat-name"><i className="dot" style={{background:c.color}}></i>{c.name}</span></td>{c.mid.map((v,j)=><td key={j}><b>{money(v)}</b><div style={{fontSize:8,color:"#94a3b8"}}>{compact(c.low[j])}–{compact(c.high[j])}</div></td>)}</tr>)}
      </tbody></table></div>
    </div>
  </div>
}

function Dashboard(){
  const allowedProjects=["VRN","SOCO","YouJoy"];
  const brandParam=new URLSearchParams(window.location.search).get("brand")||"";
  const initialProject=allowedProjects.find(p=>p.toLowerCase()===brandParam.toLowerCase())||"VRN";
  const [project,setProject]=useState(initialProject);
  const [tab,setTab]=useState("products");
  const [selectedMonth,setSelectedMonth]=useState(getMonthKeys(initialProject).slice(-1)[0]||"aug");
  const changeProject=(p)=>{
    setProject(p);
    setTab("products");
    const keys=getMonthKeys(p);
    setSelectedMonth(keys[keys.length-1]||"aug");
    const url=new URL(window.location.href);
    url.searchParams.set("brand",p);
    window.history.replaceState({},"",url);
  };
  return <div className="shell">
    <div className="header">
      <div><h1 className="h1">Дашборд продажів</h1><div className="sub">Роздріб · тільки оплачені · ОПТ виключено · історія по місяцях + деталізація продажів і реклами</div></div>
      <div className="project-tabs">{["VRN","SOCO","YouJoy"].map(p=><button key={p} className={`pbtn ${project===p?"active":""}`} onClick={()=>changeProject(p)}>{p}</button>)}</div>
    </div>
    <div className="tabs">
      <button className={`tabbtn ${tab==="products"?"active":""}`} onClick={()=>setTab("products")}>📦 Товари / факт</button>
      <button className={`tabbtn ${tab==="ads"?"active":""}`} onClick={()=>setTab("ads")}>📊 Реклама</button>
      <button className={`tabbtn ${tab==="forecast"?"active":""}`} onClick={()=>setTab("forecast")}>🔮 План продажів</button>
    </div>
    {tab!=="forecast"&&<MonthSelector project={project} selectedMonth={selectedMonth} setSelectedMonth={setSelectedMonth} tab={tab}/>}    
    {tab==="products"&&<ProductsTab project={project} selectedMonth={selectedMonth} setSelectedMonth={setSelectedMonth}/>}    
    {tab==="ads"&&<AdsTab project={project} selectedMonth={selectedMonth}/>}    
    {tab==="forecast"&&<ForecastTab project={project}/>}  
  </div>
}

ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard/>);
</script></body></html>
